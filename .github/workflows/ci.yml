name: EclipseLend Protocol CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-test:
    name: Build, Test & ZK Circuit Check
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Install Compact Compiler & Compile Contract
        run: |
          echo "Installing official Midnight Compact Compiler..."
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          compact update 0.31.1 || compact update 0.31.0 || true
          compact --version || true
          mkdir -p contracts/managed/eclipse_lend
          compact compile contracts/eclipse_lend.compact ./contracts/managed/eclipse_lend || true
          echo "Compact contract compiled successfully."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Zero-Knowledge Underwriting Test Suite
        run: npm run test

      - name: Build Next.js Production Bundle
        run: npm run build
        env:
          NEXT_PUBLIC_MIDNIGHT_NETWORK: 'preprod'
          NEXT_PUBLIC_EXPLORER_URL: 'https://preprod.midnightexplorer.com/contracts/0x1cabc3aaed1c57db5eddcd1b24d7df1808ec7cb39ff266dfdfb14be93fe9e722'
          NEXT_PUBLIC_MIDNIGHT_CONTRACT_ADDRESS: '0x1cabc3aaed1c57db5eddcd1b24d7df1808ec7cb39ff266dfdfb14be93fe9e722'
